
name: Deploy LiFE Mitra Admin to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-admin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - - name: Build Admin Web
        run: |
          flutter build web --release -t lib/main_admin.dart --verbose 2>&1 | tee flutter-build.log

          - name: Upload Flutter Build Logs
  if: always()
  uses: actions/upload-artifact@v4
  with:
    name: flutter-build-logs
    path: flutter-build.log
    if-no-files-found: ignore

      - name: Prepare Vercel output
        run: |
          mkdir -p .vercel/output/static
          cp -R build/web/. .vercel/output/static/
          echo '{"version":3,"routes":[{"handle":"filesystem"},{"src":"/.*","dest":"/index.html"}]}' > .vercel/output/config.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        run: |
          vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
